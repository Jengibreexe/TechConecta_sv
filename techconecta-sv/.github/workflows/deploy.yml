name: CI/CD TechConecta API

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Instalar dependencias y correr pruebas
        working-directory: api
        run: |
          npm ci
          npm test --if-present

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Copiar código a EC2
        run: |
          rsync -az --delete --exclude node_modules --exclude .env \
            api/ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/techconecta-api/

      - name: Copiar frontend a EC2
        run: |
          rsync -az --delete web/ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/techconecta/

      - name: Reiniciar API con PM2
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} '
            cd ~/techconecta-api &&
            npm ci --omit=dev &&
            (pm2 reload techconecta-api || pm2 start src/index.js --name techconecta-api) &&
            pm2 save'
